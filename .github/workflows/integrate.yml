name: integrate

on:
  pull_request:
    paths: ["**", "!**.md"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if version is available to publish
        run: './.github/bin/check_version_is_free "$(jq -r ''.version'' package.json)"'
        continue-on-error: true
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
      - name: Install dependencies
        run: "npm ci"
      - name: Lint code
        run: "npm run lint"
      - name: Check Astro config
        run: "npm run astro check"
      - name: Build app
        run: "npm run build"
