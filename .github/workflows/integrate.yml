name: integrate

on:
  pull_request:
    paths: ["**", "!**.md"]

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Check for CRLF line endings"
        uses: gi-org-pl/check-crlf-action@v1
      - name: "Check for file permission changes"
        uses: gi-org-pl/check-file-permissions-action@v1
      - name: "Check app version is unique"
        uses: gi-org-pl/check-version-action@v1
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
      - name: Install dependencies
        run: "npm ci"
      - name: Lint code
        run: "npm run lint"
      - name: Check Astro config
        run: "npm run astro check"
      - name: Build app
        run: "npm run build"
